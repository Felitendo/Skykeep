# What both Windows jobs (windows.yml: tests, build) need before they compile, in one place:
# Node and the window's files, the Tauri versions checked, Rust with its cache, and the HEIC
# decoder. The checkout stays in each job, before this.
name: Windows setup
description: Node, the interface build, Rust and libheif for a Windows build of Skykeep

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm ci --no-audit --no-fund
    # `tauri build` refuses a Tauri npm package and Rust crate on different minor versions —
    # checked first, so a mismatch costs seconds, not a whole compile.
    - name: Tauri versions match
      shell: bash
      run: |
        node -e '
          const lock = require("./package-lock.json").packages;
          const npm = lock["node_modules/@tauri-apps/api"].version;
          const rust = require("fs").readFileSync("Cargo.lock", "utf8").match(/name = "tauri"\r?\nversion = "([^"]+)"/)[1];
          const mm = (v) => v.split(".").slice(0, 2).join(".");
          console.log(`@tauri-apps/api ${npm}, tauri crate ${rust}`);
          if (mm(npm) !== mm(rust)) { console.error("Tauri npm package and crate differ: align them"); process.exit(1); }'
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    # One cache for both jobs: the tests and the installers compile the same crates in release
    # mode with the same flags, so whichever finishes first keeps it for the next run.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: windows-release
    # HEIC decoding: libheif with its default codecs (libde265 decodes), linked in statically,
    # with the C and C++ runtimes too (the x64-windows-static triplet, /MT, matching Rust's
    # crt-static): skykeep.exe then needs no Visual C++ Redistributable, which a fresh Windows
    # doesn't have — without it the program can't start at all (STATUS_DLL_NOT_FOUND). What
    # vcpkg links in (libheif, libde265, x265) is listed with its licences in
    # packaging/licences/extra.json; a new cache key can bring new versions, so check it there.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: C:\vcpkg\installed
        key: vcpkg-libheif-default-x64-windows-static-v1
    - name: HEIC decoder
      shell: pwsh
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif:x64-windows-static"
        "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        "VCPKGRS_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
    # The window's files must exist for the app crate to compile.
    - shell: bash
      run: npm run build
