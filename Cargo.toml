[workspace]
resolver = "2"
members = ["probe", "crates/quince-auth", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
