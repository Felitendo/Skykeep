name: Something isn't working
description: A bug, a crash, or something that looks wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot or a short recording helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skykeep version
      description: Settings → About → Version.
      placeholder: "0.1.10"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Microsoft Store
        - Windows installer (.exe or .msi)
        - Scoop, winget or Chocolatey
        - Snap Store
        - Flatpak
        - AppImage
        - .deb
        - .rpm
        - Fedora COPR
        - AUR or Omarchy
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Your OS and version, and on Linux your desktop (GNOME, KDE, Hyprland…).
      placeholder: "Fedora 43, KDE Plasma 6.5"
    validations:
      required: true
  - type: checkboxes
    id: adp
    attributes:
      label: Your iCloud
      options:
        - label: Advanced Data Protection is turned on for this Apple Account
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Start Skykeep from a terminal with SKYKEEP_LOG=1 and paste what it prints around the problem. It never includes your password or your data, but read it over before posting.
      render: text
