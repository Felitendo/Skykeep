[package]
name = "quince-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fast_image_resize = "6.1.0"
# Only the formats Apple has been observed to serve. Every extra decoder is compile time and
# attack surface for no gain.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"

# HEIC decoded with libheif where the system has it (Linux packages it everywhere). On Windows
# it is not built yet: HEIC is shown at Apple's own JPEG sizes there until the system's own
# decoder (the Windows Imaging Component) is used.
[target.'cfg(not(windows))'.dependencies]
libheif-rs = "3.0.0"
