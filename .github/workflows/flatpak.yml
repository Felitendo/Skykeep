# Builds the Flatpak the way Flathub does: in the Flathub build container, offline, from the
# manifest and the generated cargo and npm source lists. A test before submitting to Flathub.
name: Flatpak

on:
  workflow_dispatch:
  push:
    branches: [flatpak]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: skykeep.flatpak
          manifest-path: packaging/flatpak/io.github.yashwanthkamireddi.Skykeep.yml
          cache-key: flatpak-builder-${{ github.sha }}
