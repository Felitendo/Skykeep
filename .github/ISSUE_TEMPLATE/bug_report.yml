name: Bug report
description: Something in Skykeep isn't working as it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A clear report gets fixed fastest.

        **Security problem?** Please don't file it here. Use [private vulnerability reporting](https://github.com/YashwanthKamireddi/Skykeep/security/advisories/new) instead.

        **Privacy first:** before attaching logs or screenshots, remove anything personal (names, email addresses, phone numbers, note contents). Never paste a password, a two-factor code, or the contents of `cookies.json`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Open Reminders
        2. Tick a repeating reminder
        3. Expected the next one to appear; instead…
    validations:
      required: true

  - type: dropdown
    id: app
    attributes:
      label: Which app?
      multiple: true
      options:
        - Notes
        - Reminders
        - Calendar
        - Contacts
        - iCloud Drive
        - iCloud Drive folder (file manager)
        - Photos
        - Sign-in / account
        - Settings / export
        - Tray, notifications or quick capture
        - Installation / packaging
        - Other
    validations:
      required: true

  - type: dropdown
    id: sync
    attributes:
      label: Is your data affected?
      description: Helps us prioritise. Anything that loses or duplicates data is fixed first.
      options:
        - "No, it's a display or behaviour problem"
        - "A change didn't reach my iPhone (or didn't arrive from it)"
        - "Something was lost, duplicated or changed unexpectedly"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Skykeep version
      description: Shown in Settings → About. For a source build, also the commit (`git rev-parse --short HEAD`).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows (beta)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - AUR
        - Flatpak
        - .deb
        - .rpm
        - AppImage
        - Windows .exe installer
        - Windows .msi
        - Built from source
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution or Windows version
      placeholder: "Fedora 43, Ubuntu 26.04, Arch, Windows 11 24H2…"
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Desktop and session (Linux)
      description: Your desktop environment or compositor, and Wayland or X11.
      placeholder: "GNOME 49 on Wayland, KDE Plasma 6.5 on X11, Hyprland…"

  - type: dropdown
    id: adp
    attributes:
      label: Advanced Data Protection
      description: On your iPhone, Settings → your name → iCloud → Advanced Data Protection.
      options:
        - "Off"
        - "On, with Access iCloud Data on the Web turned on"
        - "On, with Access iCloud Data on the Web turned off"
        - "Not sure"

  - type: dropdown
    id: account
    attributes:
      label: Apple Account
      description: Accounts in mainland China and Managed Apple Accounts (from a school or workplace) aren't supported yet, so this tells us where to start.
      options:
        - "Personal, outside mainland China"
        - "Personal, in mainland China"
        - "Managed (school or workplace)"
        - "Not sure"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        **Linux:** quit Skykeep from the tray, run it from a terminal so its messages are printed, reproduce the problem, then paste what's relevant:
        `skykeep 2>&1 | tee skykeep.log`
        (Flatpak: `flatpak run io.github.yashwanthkamireddi.Skykeep 2>&1 | tee skykeep.log`;
        AppImage: `./Skykeep_*.AppImage 2>&1 | tee skykeep.log`).

        **Windows:** release builds don't print to a console. Copy the exact text of any error Skykeep shows, or attach a screenshot of it below.

        Please look through the log and remove anything personal first.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a recording
      description: Optional, often very helpful. Use test data or blur anything personal.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this hasn't been reported.
          required: true
        - label: I removed personal information from the logs and screenshots.
          required: true
