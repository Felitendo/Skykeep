[package]
name = "quince-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quince-vfs = { path = "../crates/quince-vfs" }
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
quince-auth = { path = "../crates/quince-auth" }
quince-core = { path = "../crates/quince-core" }
quince-media = { workspace = true }
quince-icloud = { path = "../crates/quince-icloud" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
anyhow.workspace = true
jiff = "0.2.37"
uuid.workspace = true
base64 = "0.22"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2"
notify-rust = "4"
tauri-plugin-single-instance = "2"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
# A video's poster when Apple's is blank: one frame read with GStreamer, which WebKitGTK
# already needs, so nothing new is installed. Linux only: elsewhere Apple's poster stands.
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
zbus = "5"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tempfile = "3"
