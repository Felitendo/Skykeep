# Builds the Flatpak the way Flathub does: in the Flathub build container, offline, from the
# manifest and the generated cargo and npm source lists. A test before submitting to Flathub.
name: Flatpak

on:
  workflow_dispatch:
  push:
    branches: [flatpak]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: skykeep.flatpak
          manifest-path: packaging/flatpak/io.github.yashwanthkamireddi.Skykeep.yml
          cache-key: flatpak-builder-${{ github.sha }}

  starts:
    # The bundle installs and Skykeep starts and stays up, offline, under a virtual display.
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skykeep-x86_64.flatpak
      - name: It installs and starts
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive skykeep.flatpak
          set +e
          timeout 20 dbus-run-session -- xvfb-run -a flatpak run io.github.yashwanthkamireddi.Skykeep > run.log 2>&1
          code=$?
          tail -40 run.log
          [ "$code" -eq 124 ] || { echo "::error::Skykeep exited ($code) instead of staying up"; exit 1; }
