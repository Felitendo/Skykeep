name: Feature request
description: Suggest something Skykeep could do better or do next.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. For open-ended brainstorming, [Discussions → Ideas](https://github.com/YashwanthKamireddi/Skykeep/discussions/categories/ideas) is a great place to start. Use this form when you have a concrete request.

  - type: dropdown
    id: app
    attributes:
      label: Which app?
      multiple: true
      options:
        - Notes
        - Reminders
        - Calendar
        - Contacts
        - iCloud Drive
        - Photos
        - Desktop integration (tray, notifications, search, files)
        - Packaging / a new platform
        - Everywhere
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or moment where Skykeep falls short today. A real situation helps a lot.
      placeholder: "When I'm planning my week, I'd like to…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Your idea for it. If Apple's own app on iPhone or Mac does this, describe how it behaves there.

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: A workaround, another app, or icloud.com.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be interested in helping build this.
