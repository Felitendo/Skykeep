# GNOME Shell's search provider: what is typed in the Activities overview is asked of Skykeep
# too (src-tauri/src/search_provider.rs). Installed to /usr/share/gnome-shell/search-providers/.
# BusName starts Skykeep hidden if it is not running (the .SearchProvider.service beside this).
[Shell Search Provider]
DesktopId=io.github.yashwanthkamireddi.Skykeep.desktop
BusName=io.github.yashwanthkamireddi.Skykeep.SearchProvider
ObjectPath=/io/github/yashwanthkamireddi/Skykeep/SearchProvider
Version=2
