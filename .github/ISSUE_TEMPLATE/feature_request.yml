name: An idea
description: Something Skykeep should do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you want to do, and how you do it on your iPhone, iPad or Mac today if you can.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Windows or Linux, and on Linux your desktop.
