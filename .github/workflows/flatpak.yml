# The Flatpak, built from packaging/flatpak/ exactly as Flathub would build it (offline, from
# the generated cargo and npm sources), and kept as a .flatpak bundle. Proves the manifest
# without installing flatpak-builder anywhere. Run by hand: Actions → Flatpak → Run workflow.
name: Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The GNOME 51 runtime and SDK, preinstalled (the manifest's runtime-version).
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          # The manifest's main source is this repository as a git checkout (`path: ../..`);
          # a shallow clone of it cannot be cloned again.
          fetch-depth: 0
      - name: The checkout, trusted inside the container
        run: git config --global --add safe.directory '*'
      - name: Flathub's shared modules (the tray library)
        run: git clone --depth 1 https://github.com/flathub/shared-modules.git packaging/flatpak/shared-modules
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.yashwanthkamireddi.Skykeep.yml
          bundle: skykeep.flatpak
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'package-lock.json') }}
          upload-artifact: true
