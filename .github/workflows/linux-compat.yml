# Skykeep on every mainstream Linux, proven rather than assumed: the .deb, .rpm, Arch package
# and AppImage each installed with the distribution's own package manager in a clean container
# of it, then packaging/linux-compat/check.sh — every library found, the GStreamer elements
# the player needs, a HEIC decoded through the system's libheif, a made-up session through
# gnome-keyring's Secret Service by the app's own sign-in storage, the page drawn under Xvfb
# and the program still up 8 s later, and the launchers, metainfo and icons valid.
#
# Not on every push: by hand (Actions → Linux compatibility → Run workflow), and for a release
# tag. The packages are built the way release.yml builds them, on Ubuntu 24.04 — the oldest
# base whose libheif (1.17) the app accepts; Debian 12 (libheif 1.15, glibc 2.36) cannot run it.
name: Linux compatibility

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: linux-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev libheif-dev libfuse3-dev pkg-config patchelf rpm file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libheif-examples libheif-plugin-x265
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Build the packages
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep
        run: npx tauri build
      - name: Build the check's probe
        run: cargo build --release --locked -p quince-probe --example distro_check
      - name: A HEIC made for the test
        # A 64×48 gradient, written as raw YUV and encoded with x265 — nobody's photo.
        run: |
          W=64 H=48
          { printf 'YUV4MPEG2 W%s H%s F25:1 Ip A1:1 C420jpeg\nFRAME\n' "$W" "$H"
            LC_ALL=C awk -v w=$W -v h=$H 'BEGIN {
              for (y = 0; y < h; y++) for (x = 0; x < w; x++) printf "%c", 16 + int(200 * x / w)
              for (i = 0; i < w * h / 2; i++) printf "%c", 90 + int(80 * (i % (w / 2)) / (w / 2)) }'
          } > "$RUNNER_TEMP/test.y4m"
          heif-enc -q 80 -o test.heic "$RUNNER_TEMP/test.y4m"
      - name: Gather
        run: |
          mkdir compat
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
             target/release/bundle/appimage/*.AppImage \
             target/release/examples/distro_check test.heic packaging/linux-compat/check.sh compat/
          ls -l compat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-compat
          path: compat/
          if-no-files-found: error
          retention-days: 7

  install:
    needs: build
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 24.04 (.deb)", image: "ubuntu:24.04", pkg: "*.deb" }
          - { name: "Debian 13 (.deb)", image: "debian:trixie", pkg: "*.deb" }
          # Linux Mint 22 and Pop!_OS 24.04 are both Ubuntu 24.04 underneath; Mint publishes
          # an image of its own, Pop!_OS does not.
          - { name: "Linux Mint 22 (.deb)", image: "linuxmintd/mint22-amd64", pkg: "*.deb" }
          - { name: "Fedora 41 (.rpm)", image: "fedora:41", pkg: "*.rpm" }
          - { name: "Fedora 42 (.rpm)", image: "fedora:42", pkg: "*.rpm" }
          - { name: "openSUSE Tumbleweed (.rpm)", image: "opensuse/tumbleweed", pkg: "*.rpm" }
          - { name: "Debian 13 (AppImage)", image: "debian:trixie", pkg: "*.AppImage" }
          - { name: "Fedora 42 (AppImage)", image: "fedora:42", pkg: "*.AppImage" }
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-compat
          path: /compat
      - name: Install and run
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          chmod +x /compat/check.sh /compat/distro_check
          # shellcheck disable=SC2086
          bash /compat/check.sh /compat/$PKG /compat/distro_check /compat/test.heic

  arch:
    needs: build
    name: Arch Linux (PKGBUILD)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:latest
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm --needed base-devel git rust nodejs npm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-compat
          path: /compat
      - name: makepkg, as a user (it refuses root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          # The package's own dependencies, from its PKGBUILD, as makepkg -s would install them.
          # shellcheck disable=SC1091
          (cd packaging/arch && source PKGBUILD && pacman -S --noconfirm --needed --asdeps "${depends[@]}" "${makedepends[@]}")
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && CARGO_BUILD_JOBS=4 makepkg -f --noconfirm"
      - name: Install and run
        run: |
          chmod +x /compat/check.sh /compat/distro_check
          bash /compat/check.sh "$(ls "$GITHUB_WORKSPACE"/packaging/arch/skykeep-*.pkg.tar.zst)" \
            /compat/distro_check /compat/test.heic
