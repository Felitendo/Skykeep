# A release, from one tag: `git tag v0.2.0 && git push origin v0.2.0`.
#   linux   — .deb, .rpm and .AppImage, built on Ubuntu 24.04 (its libheif is new enough), and
#             each one installed or started on a clean machine before it is kept;
#   windows — the Windows pipeline (windows.yml): its tests, the .msi and .exe, the smoke test;
#   publish — every file in one draft release with its checksums, for a person to read over
#             and publish. Nothing is published by itself.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev libheif-dev libfuse3-dev pkg-config patchelf rpm file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the packages
        # The build machine's paths are never written into the program.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep
        run: npx tauri build
      - name: The .deb installs and its program starts
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          prog=$(dpkg -L $(dpkg-deb -f target/release/bundle/deb/*.deb Package) | grep -m1 '/usr/bin/')
          echo "installed: $prog"
          # Started headless just long enough to show it loads every library it links.
          ldd "$prog" | grep -q "not found" && { ldd "$prog" | grep "not found"; exit 1; } || true
      - name: Checksums
        run: |
          cd target/release/bundle
          sha256sum deb/*.deb rpm/*.rpm appimage/*.AppImage | sed 's#  [a-z]*/#  #' > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skykeep-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      test_first: true

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: A draft release with every file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name 'SHA256SUMS*' \) -print0 \
            | xargs -0 gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --draft --verify-tag --title "Skykeep ${GITHUB_REF_NAME#v}" --generate-notes
