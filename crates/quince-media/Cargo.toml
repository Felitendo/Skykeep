[package]
name = "quince-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fast_image_resize = "6.1.0"
# Only the formats Apple has been observed to serve. Every extra decoder is compile time and
# attack surface for no gain.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"

# HEIC decoded with libheif: the system's on Linux, and on Windows one built in by vcpkg
# (`libheif[core,libde265]`, decoding only; see the Windows workflow) — not Windows' own
# decoder, which needs two Store extensions most machines do not have. Left out only of the
# MinGW cross-check, which has no vcpkg.
[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
libheif-rs = "3.0.0"
