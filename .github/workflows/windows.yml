# Skykeep for Windows, proven on Windows before anyone downloads it:
#   1. build — on one machine, in order: the Tauri versions checked (seconds), the whole test
#              suite in release mode with the real Credential Manager, then the .msi and the
#              per-user .exe installer from the same compiled crates. One compile, not two;
#   2. smoke — the .exe installed silently, Skykeep launched, its window seen on screen, and a
#              screenshot kept, so an installer that cannot even start is never handed over;
#   ui       — every interface suite in Edge, only when asked for: Edge is the Chromium engine
#              ci.yml already runs every suite in on each push.
# Run by hand (Actions → Windows build → Run workflow) or by a release (release.yml); never on
# every push.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      test_first:
        description: "Run the whole test suite on Windows before building"
        type: boolean
        default: true
      edge_ui:
        description: "Also run every interface suite in Edge (about 30 minutes)"
        type: boolean
        default: false
  # A release (release.yml) builds Windows through this same, proven pipeline.
  workflow_call:
    inputs:
      test_first:
        type: boolean
        default: true
      edge_ui:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `tauri build` refuses a Tauri npm package and Rust crate on different minor versions —
      # checked first, so a mismatch costs seconds, not a whole compile.
      - name: Tauri versions match
        shell: bash
        run: |
          node -e '
            const lock = require("./package-lock.json").packages;
            const npm = lock["node_modules/@tauri-apps/api"].version;
            const rust = require("fs").readFileSync("Cargo.lock", "utf8").match(/name = "tauri"\r?\nversion = "([^"]+)"/)[1];
            const mm = (v) => v.split(".").slice(0, 2).join(".");
            console.log(`@tauri-apps/api ${npm}, tauri crate ${rust}`);
            if (mm(npm) !== mm(rust)) { console.error("Tauri npm package and crate differ: align them"); process.exit(1); }'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
      # HEIC decoding: libheif with its default codecs (libde265 decodes), linked in statically.
      - uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-default-x64-windows-static-md-v1
      - name: HEIC decoder
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif:x64-windows-static-md"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
      # The window's files must exist for the app crate to compile.
      - run: npm run build
      - name: Tests, on Windows
        if: ${{ inputs.test_first }}
        # In release mode, so the installer build below reuses what this compiled. The probe
        # examples are live tools for Linux (one mounts a FUSE folder), not tests.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep
        run: cargo test --release --workspace --lib --bins --tests --locked --no-fail-fast
      - name: Build the installers
        # The build machine's paths are never written into the program.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=skykeep
        run: npx tauri build
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle -Recurse -Include *.msi,*.exe
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content target/release/bundle/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skykeep-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/SHA256SUMS-windows.txt
          if-no-files-found: error

  # Every interface suite in Microsoft Edge — the engine WebView2 is — with Windows' own fonts,
  # and every screen photographed light and dark, to be looked at.
  ui:
    if: ${{ inputs.edge_ui }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Interface suites, in Edge
        shell: pwsh
        env:
          ENGINE: msedge
        run: |
          $shots = "$PWD\shots"; New-Item -ItemType Directory -Force $shots | Out-Null
          $env:TMPDIR = $shots
          # Node runs vite directly: `npx` is a .cmd script on Windows, which Start-Process cannot
          # launch, and every suite then met a refused connection. Bound to every address, so
          # "localhost" answers whether it resolves to 127.0.0.1 or ::1.
          $preview = Start-Process node -ArgumentList "node_modules/vite/bin/vite.js","preview","--port","4173","--strictPort","--host" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$shots\preview.log" -RedirectStandardError "$shots\preview-err.log"
          $up = $false
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-WebRequest http://localhost:4173 -UseBasicParsing | Out-Null; $up = $true; break } catch { Start-Sleep 1 } }
          if (-not $up) { Get-Content "$shots\preview.log","$shots\preview-err.log" -ErrorAction SilentlyContinue; throw "the preview server did not come up" }
          "preview up"
          node .uiverify/look-all.mjs $shots 1400 850 dark
          node .uiverify/look-all.mjs "$shots" 1400 850 light
          Get-ChildItem $shots -Filter "all-*.png" | ForEach-Object { Rename-Item $_.FullName ($_.Name -replace "^all-", "screen-") -ErrorAction SilentlyContinue }
          $failed = @()
          $suites = Get-ChildItem .uiverify -Filter *.mjs | Where-Object {
            $_.Name -notmatch '^(look|dbg|engine|stub|assert|crash|shots)' -and $_.Name -notmatch '\.test\.mjs$' -and (Select-String -Path $_.FullName -Pattern 'engine.mjs' -Quiet)
          }
          foreach ($t in $suites) {
            node $t.FullName *> "$shots\$($t.BaseName).log"
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name; "FAIL $($t.Name)" } else { "ok   $($t.Name)" }
          }
          Stop-Process -Id $preview.Id -ErrorAction SilentlyContinue
          "$($suites.Count - $failed.Count) of $($suites.Count) suites passed in Edge"
          if ($failed.Count) { $failed | Set-Content "$shots\FAILED.txt"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skykeep-ui-in-edge
          path: shots
          if-no-files-found: ignore

  smoke:
    needs: build
    # Whenever an installer was built — a quick build included, its tests skipped.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skykeep-windows
          path: dist
      - name: Install, launch, and see the window
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter *-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter skykeep.exe | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter skykeep.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { throw "Skykeep was not installed" }
          "installed at $($exe.FullName)"
          # Alerts are sent as the app the Start menu knows; without that ID on its entry they
          # came from "Windows PowerShell".
          $entry = Get-StartApps | Where-Object { $_.Name -eq "Skykeep" } | Select-Object -First 1
          if (-not $entry -or $entry.AppID -ne "io.github.yashwanthkamireddi.Skykeep") { throw "Start menu entry has app ID '$($entry.AppID)', not io.github.yashwanthkamireddi.Skykeep" }
          "start menu app ID: $($entry.AppID)"
          $p = Start-Process $exe.FullName -PassThru
          $title = ""
          for ($i = 0; $i -lt 30 -and -not $title; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { throw "Skykeep exited on start (code $($p.ExitCode))" }
            $p.Refresh(); $title = $p.MainWindowTitle
          }
          if ($title -ne "Skykeep") { throw "no Skykeep window after 60 s (title: '$title')" }
          "window up: $title"
          Start-Sleep -Seconds 6
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\skykeep-on-windows.png")
          if ($p.HasExited) { throw "Skykeep closed by itself" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skykeep-on-windows
          path: skykeep-on-windows.png
          if-no-files-found: ignore
