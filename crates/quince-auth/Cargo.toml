[package]
name = "quince-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64 = "0.22"
num-bigint = "0.4"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
rand = "0.9"
reqwest_cookie_store = "0.8"
cookie_store = { version = "0.21", features = ["serde_json"] }
thiserror = "2"
# Looking up Apple's hosts for the client's own resolver (AppleOnly).
tokio = { workspace = true, features = ["net"] }
# The updater's client (releases.rs), locked like Apple's: the reqwest the Tauri updater plugin
# is built on, with no TLS of its own — the plugin's (rustls on ring) is the one compiled.
reqwest_releases = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
tempfile = "3"

# Each system's own keyring, behind the same `keyring` API: the Secret Service on Linux, the
# Credential Manager on Windows, the Keychain on macOS. One set of features for all three
# pulled D-Bus into a Windows build, which cannot link it.
#
# `linux-native` selects the KERNEL keyutils backend, which is session-scoped and does not
# survive a reboot — the trust token would quietly evaporate and the app would ask for a code
# again, the exact failure this project exists to fix. The Secret Service backend is the
# persistent one (gnome-keyring / kwallet).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
